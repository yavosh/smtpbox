name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

    - name: Set up Go
      uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
      with:
        go-version: '1.27.4'

    - name: Install lint and formatting tool
      run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0

    - name: Build
      run: go build -v ./...

    - name: Test
      run: go test -race -v ./...

    - name: Lint
      run: make lint

    - name: Check formatting
      run: make fmt-check

  docker:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: smtpbox:ci

      - name: Start container
        run: |
          docker run -d --cidfile "$RUNNER_TEMP/smtpbox.cid" \
            -p 127.0.0.1::8080/tcp \
            -p 127.0.0.1::1025/tcp \
            -p 127.0.0.1::1053/udp \
            -e SMTP_DOMAIN=nar.cy -e DNS_DOMAIN=nar.cy smtpbox:ci

      - name: Test HTTP, SMTP, and DNS
        run: |
          container_id=$(cat "$RUNNER_TEMP/smtpbox.cid")
          http_port=$(docker port "$container_id" 8080/tcp | cut -d: -f2)
          smtp_port=$(docker port "$container_id" 1025/tcp | cut -d: -f2)
          dns_port=$(docker port "$container_id" 1053/udp | cut -d: -f2)
          python3 scripts/docker-smoke.py "$http_port" "$smtp_port" "$dns_port"

      - name: Show container logs
        if: failure()
        run: |
          if [ -s "$RUNNER_TEMP/smtpbox.cid" ]; then
            docker logs "$(cat "$RUNNER_TEMP/smtpbox.cid")"
          fi

      - name: Remove container
        if: always()
        run: |
          if [ -s "$RUNNER_TEMP/smtpbox.cid" ]; then
            docker rm -f "$(cat "$RUNNER_TEMP/smtpbox.cid")"
          fi
